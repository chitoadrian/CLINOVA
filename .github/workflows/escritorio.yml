name: Escritorio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencias Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_sqlite.py
      - name: Compilar Windows
        if: runner.os == 'Windows'
        run: npm run desktop:build -- --bundles nsis,msi
      - name: Compilar Linux
        if: runner.os == 'Linux'
        run: npm run desktop:build -- --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: clinova-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
