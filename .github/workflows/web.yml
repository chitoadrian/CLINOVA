name: Web
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 tests/test_sqlite.py
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: clinova-web
          path: dist/
