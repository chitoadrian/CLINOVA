[package]
name = "clinova"
version = "0.4.0"
description = "CLINOVA - proyecto académico"
authors = ["Grupo 3 - Unidad Educativa Montepiedra"]
edition = "2021"

[lib]
name = "clinova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
pbkdf2 = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
